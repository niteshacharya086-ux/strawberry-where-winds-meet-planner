<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" role="img" aria-label="Round panda in a kung fu sprint">
  <defs>
    <radialGradient id="fur" cx="34%" cy="23%" r="78%"><stop stop-color="#fff"/><stop offset=".6" stop-color="#f4f2ee"/><stop offset="1" stop-color="#c6c3be"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#514e4c"/><stop offset=".42" stop-color="#1b1a1b"/><stop offset="1" stop-color="#070708"/></linearGradient>
    <radialGradient id="belly" cx="35%" cy="20%" r="85%"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f0ede8"/><stop offset="1" stop-color="#c3c0bb"/></radialGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7bd67"/><stop offset=".5" stop-color="#9b682e"/><stop offset="1" stop-color="#f4d78c"/></linearGradient>
  </defs>
  <style>
    .po { transform-box:fill-box; transform-origin:center bottom; animation: po-bounce .32s cubic-bezier(.4,0,.6,1) infinite alternate; }
    .leg-a { transform-box:view-box; transform-origin:63px 83px; animation: po-leg .24s cubic-bezier(.42,0,.58,1) infinite alternate; }
    .leg-b { transform-box:view-box; transform-origin:78px 83px; animation: po-leg .24s cubic-bezier(.42,0,.58,1) infinite alternate-reverse; }
    .arm-a { transform-box:view-box; transform-origin:48px 55px; animation: po-arm .24s cubic-bezier(.42,0,.58,1) infinite alternate; }
    .arm-b { transform-box:view-box; transform-origin:91px 55px; animation: po-arm .24s cubic-bezier(.42,0,.58,1) infinite alternate-reverse; }
    @keyframes po-bounce { from{transform:translateY(1px) rotate(-1.5deg)} to{transform:translateY(-3px) rotate(1.5deg)} }
    @keyframes po-leg { from{transform:rotate(-42deg)} to{transform:rotate(48deg)} }
    @keyframes po-arm { from{transform:rotate(35deg)} to{transform:rotate(-38deg)} }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important } }
  </style>
